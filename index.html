<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HD Fusion Gyro Cam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: manipulation; }
    .grid-bg {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans grid-bg select-none p-4">

  <!-- Header -->
  <header class="max-w-md mx-auto w-full flex items-center justify-between pb-3 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div id="statusDot" class="w-3 h-3 rounded-full bg-slate-600"></div>
      <h1 class="font-bold tracking-wide text-base text-slate-200">Fusion Gyro Cam</h1>
    </div>
    <span id="activeSensorLabel" class="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400">
      Cam: Offline
    </span>
  </header>

  <!-- Main Workspace -->
  <main class="max-w-md mx-auto w-full my-auto flex flex-col gap-3 py-2">

    <!-- Security/Camera Notice -->
    <div id="permissionNotice" class="bg-amber-950/40 border border-amber-500/40 text-amber-200 text-xs p-3 rounded-xl flex flex-col gap-1">
      <span class="font-bold">Sensor Fusion Cam Setup:</span>
      <span>Tap <strong>Enable Camera</strong> to initiate high-speed sensor fusion and live video rotation.</span>
    </div>

    <!-- Square Stabilized Canvas Display -->
    <div class="relative w-full aspect-square bg-slate-900 border-2 border-slate-800 rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center">
      
      <!-- Hidden Raw Video Element -->
      <video id="rawVideo" autoplay playsinline muted class="hidden"></video>

      <!-- Rendered Square Canvas (1080x1080) -->
      <canvas id="stabilizedCanvas" width="1080" height="1080" class="w-full h-full object-cover bg-slate-950"></canvas>

      <!-- Overlay HUD Info -->
      <div class="absolute top-3 left-3 bg-slate-950/80 backdrop-blur border border-slate-800 rounded-lg px-2.5 py-1 flex items-center gap-2">
        <div id="recPulse" class="w-2 h-2 rounded-full bg-slate-500"></div>
        <span class="text-[11px] font-mono font-bold text-slate-200">TILT: <span id="totalTiltDisplay" class="text-emerald-400">0.0</span>°</span>
      </div>

      <div class="absolute top-3 right-3 bg-slate-950/80 backdrop-blur border border-slate-800 rounded-lg px-2.5 py-1 text-[10px] font-mono text-slate-400">
        <span id="rotationStatus">FUSED ROTATION</span>
      </div>

      <!-- Center Crosshair Overlay -->
      <div class="absolute inset-0 pointer-events-none border border-slate-700/30 flex items-center justify-center">
        <div class="w-full h-[1px] bg-slate-500/20"></div>
        <div class="h-full w-[1px] bg-slate-500/20 absolute"></div>
        <div class="w-16 h-16 rounded-full border border-dashed border-emerald-500/40 absolute"></div>
      </div>

      <!-- Dynamic Tilt Indicator Dot -->
      <div id="tiltDot" class="w-5 h-5 rounded-full bg-emerald-500/90 shadow-[0_0_15px_rgba(16,185,129,0.9)] border-2 border-white absolute pointer-events-none transition-transform duration-75 ease-out flex items-center justify-center" style="transform: translate(0px, 0px);">
        <div class="w-1 h-1 bg-white rounded-full"></div>
      </div>
    </div>

    <!-- Live Telemetry Cards -->
    <div class="grid grid-cols-2 gap-2">
      <div class="bg-slate-900/60 border border-slate-800 p-2.5 rounded-xl">
        <div class="flex justify-between items-center text-[11px] text-slate-400">
          <span>PITCH (ΔX)</span>
          <span class="font-mono text-cyan-400 font-bold" id="pitchDisplay">0.0°</span>
        </div>
      </div>

      <div class="bg-slate-900/60 border border-slate-800 p-2.5 rounded-xl">
        <div class="flex justify-between items-center text-[11px] text-slate-400">
          <span>ROLL / ROTATION (ΔY)</span>
          <span class="font-mono text-indigo-400 font-bold" id="rollDisplay">0.0°</span>
        </div>
      </div>
    </div>

    <!-- Telemetry Stream -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3">
      <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
        <span class="font-mono font-semibold">LOGS (<span id="sampleCount">0</span>)</span>
        <span id="rawDebug" class="text-[10px] text-slate-500 font-mono">Sensors Idle</span>
      </div>
      <div id="logContainer" class="h-20 overflow-y-auto font-mono text-[10px] space-y-0.5 text-slate-400 border-t border-slate-800/80 pt-1">
        <div class="text-slate-600 italic">Press "Enable Camera" to activate live sensor fusion...</div>
      </div>
    </div>

  </main>

  <!-- Actions & Recording Controls -->
  <footer class="max-w-md mx-auto w-full space-y-2 pt-1">
    
    <!-- Top Row Controls -->
    <div class="grid grid-cols-2 gap-2">
      <button id="cameraBtn" class="py-3 px-3 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5 shadow-md shadow-indigo-600/20">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0-5-5z"/>
        </svg>
        <span id="cameraBtnText">Enable Camera</span>
      </button>

      <button id="recordBtn" disabled class="py-3 px-3 bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] disabled:opacity-40 text-slate-950 text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5 shadow-md shadow-emerald-500/20">
        <svg id="recordIcon" class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8"/>
        </svg>
        <span id="recordBtnText">Start Record</span>
      </button>
    </div>

    <!-- Export Buttons Row -->
    <div class="grid grid-cols-2 gap-2">
      <button id="downloadVideoBtn" disabled class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 text-xs font-semibold rounded-xl transition flex items-center justify-center gap-1.5 border border-slate-700">
        <svg class="w-4 h-4 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        <span>Save Video</span>
      </button>

      <button id="exportCsvBtn" disabled class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 text-xs font-semibold rounded-xl transition flex items-center justify-center gap-1.5 border border-slate-700">
        <svg class="w-4 h-4 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Save CSV</span>
      </button>
    </div>

  </footer>

  <script>
    // System State Variables
    let isCameraActive = false;
    let isRecording = false;
    let baseline = null;
    let recordedData = [];
    let recordedVideoChunks = [];
    let recordStartTime = 0;

    // Sensor Fusion Angle State (in degrees)
    let fusedPitch = 0;
    let fusedRoll = 0;
    let lastSensorTime = Date.now();

    // Relative Angles from Baseline
    let deltaPitch = 0;
    let deltaRoll = 0;

    let mediaStream = null;
    let mediaRecorder = null;
    let recordedVideoBlob = null;
    let activeSensorType = 'None';

    // UI Elements
    const cameraBtn = document.getElementById('cameraBtn');
    const cameraBtnText = document.getElementById('cameraBtnText');
    const recordBtn = document.getElementById('recordBtn');
    const recordBtnText = document.getElementById('recordBtnText');
    const recordIcon = document.getElementById('recordIcon');
    const downloadVideoBtn = document.getElementById('downloadVideoBtn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');

    const rawVideo = document.getElementById('rawVideo');
    const canvas = document.getElementById('stabilizedCanvas');
    const ctx = canvas.getContext('2d');

    const pitchDisplay = document.getElementById('pitchDisplay');
    const rollDisplay = document.getElementById('rollDisplay');
    const totalTiltDisplay = document.getElementById('totalTiltDisplay');
    const tiltDot = document.getElementById('tiltDot');
    const statusDot = document.getElementById('statusDot');
    const recPulse = document.getElementById('recPulse');
    const activeSensorLabel = document.getElementById('activeSensorLabel');
    const logContainer = document.getElementById('logContainer');
    const sampleCount = document.getElementById('sampleCount');
    const rawDebug = document.getElementById('rawDebug');
    const permissionNotice = document.getElementById('permissionNotice');
    const rotationStatus = document.getElementById('rotationStatus');

    // Enable high image rendering quality
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // -------------------------------------------------------------
    // MAIN CANVAS RENDER LOOP (Continuously applies rotation)
    // -------------------------------------------------------------
    function renderFrame() {
      requestAnimationFrame(renderFrame);

      const width = canvas.width;
      const height = canvas.height;

      // Clear Canvas Background
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, width, height);

      if (isCameraActive && rawVideo.readyState >= 2) {
        ctx.save();
        
        // Move rotation axis to center of canvas
        ctx.translate(width / 2, height / 2);

        // Active angle: delta roll when recording, fused live roll when previewing
        const activeRollAngle = isRecording ? deltaRoll : fusedRoll;

        // Counter-rotate the canvas by negative roll angle to keep video level
        const rotationRadians = (-activeRollAngle * Math.PI) / 180;
        ctx.rotate(rotationRadians);

        // Crop & scale source video into a centered square
        const videoW = rawVideo.videoWidth;
        const videoH = rawVideo.videoHeight;
        const videoRatio = videoW / videoH;

        // Scale factor (1.45x) prevents black borders when camera rotates up to 90 degrees
        const fillScale = 1.45;
        let drawW, drawH;

        if (videoRatio > 1) {
          drawH = height * fillScale;
          drawW = drawH * videoRatio;
        } else {
          drawW = width * fillScale;
          drawH = drawW / videoRatio;
        }

        // Draw rotated video frame
        ctx.drawImage(rawVideo, -drawW / 2, -drawH / 2, drawW, drawH);

        ctx.restore();
      } else {
        // Placeholder text when camera is offline
        ctx.fillStyle = '#475569';
        ctx.font = '28px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CAMERA OFFLINE', width / 2, height / 2);
      }
    }

    // Start render loop immediately
    renderFrame();

    // -------------------------------------------------------------
    // 1. CAMERA INITIALIZATION
    // -------------------------------------------------------------
    cameraBtn.addEventListener('click', async () => {
      if (!isCameraActive) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1920, min: 1280 },
              height: { ideal: 1080, min: 720 },
              frameRate: { ideal: 30 }
            },
            audio: false
          });

          rawVideo.srcObject = mediaStream;
          await rawVideo.play();

          isCameraActive = true;
          cameraBtnText.textContent = 'Disable Cam';
          cameraBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
          cameraBtn.classList.add('bg-slate-700', 'hover:bg-slate-600');
          
          recordBtn.disabled = false;
          activeSensorLabel.textContent = 'Cam: Active';
          permissionNotice.classList.add('hidden');
          recPulse.classList.add('bg-emerald-400', 'animate-pulse');
          
          initSensorFusion();
        } catch (err) {
          alert('Camera Access Error: ' + err.message);
          console.error(err);
        }
      } else {
        if (mediaStream) {
          mediaStream.getTracks().forEach(t => t.stop());
        }
        isCameraActive = false;
        cameraBtnText.textContent = 'Enable Camera';
        cameraBtn.classList.remove('bg-slate-700', 'hover:bg-slate-600');
        cameraBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-500');
        
        recordBtn.disabled = true;
        if (isRecording) stopRecording();
        activeSensorLabel.textContent = 'Cam: Offline';
        recPulse.className = "w-2 h-2 rounded-full bg-slate-500";
      }
    });

    // -------------------------------------------------------------
    // 2. COMPLEMENTARY SENSOR FUSION ENGINE
    // Fuses Gyroscope (rate of change) + Accelerometer (gravity vector) + Orientation
    // -------------------------------------------------------------
    async function initSensorFusion() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch(e){}
      }

      lastSensorTime = Date.now();

      // Listen to Motion (Gyroscope & Accelerometer)
      window.addEventListener('devicemotion', handleMotionFusion, true);

      // Listen to Device Orientation as secondary absolute reference
      if ('ondeviceorientationabsolute' in window) {
        window.addEventListener('deviceorientationabsolute', handleOrientationReference, true);
        activeSensorType = 'Fusion: Gyro+Acc+Absolute';
      } else if ('ondeviceorientation' in window) {
        window.addEventListener('deviceorientation', handleOrientationReference, true);
        activeSensorType = 'Fusion: Gyro+Acc+Orientation';
      } else {
        activeSensorType = 'Fusion: Gyro+Accelerometer';
      }
    }

    function handleMotionFusion(event) {
      const now = Date.now();
      const dt = Math.max(0.001, (now - lastSensorTime) / 1000); // delta time in seconds
      lastSensorTime = now;

      const acc = event.accelerationIncludingGravity;
      const gyro = event.rotationRate;

      // 1. Calculate Pitch and Roll from Accelerometer Gravity Vectors
      let accPitch = fusedPitch;
      let accRoll = fusedRoll;

      if (acc && acc.x !== null && acc.y !== null && acc.z !== null) {
        accPitch = Math.atan2(acc.y, acc.z) * (180 / Math.PI);
        accRoll = Math.atan2(-acc.x, Math.sqrt(acc.y * acc.y + acc.z * acc.z)) * (180 / Math.PI);
      }

      // 2. Integrate Gyroscope Angular Rates (deg/sec)
      let gyroPitchRate = (gyro && gyro.alpha !== null) ? gyro.alpha : 0;
      let gyroRollRate = (gyro && gyro.gamma !== null) ? gyro.gamma : 0;

      // 3. Complementary Filter Formula:
      // High-pass filter for Gyroscope (fast changes) + Low-pass filter for Accelerometer (long term reference)
      const alpha = 0.92; // 92% Gyro, 8% Accelerometer gravity
      fusedPitch = alpha * (fusedPitch + gyroPitchRate * dt) + (1 - alpha) * accPitch;
      fusedRoll = alpha * (fusedRoll + gyroRollRate * dt) + (1 - alpha) * accRoll;

      processFusedTelemetry(fusedPitch, fusedRoll);
    }

    function handleOrientationReference(event) {
      if (event.beta !== null && event.gamma !== null) {
        // Soft correction anchor to prevent long-term integration drift
        const alphaCorr = 0.05;
        fusedPitch = (1 - alphaCorr) * fusedPitch + alphaCorr * event.beta;
        fusedRoll = (1 - alphaCorr) * fusedRoll + alphaCorr * event.gamma;
      }
    }

    function processFusedTelemetry(p, r) {
      activeSensorLabel.textContent = activeSensorType;

      if (!isRecording) {
        // Live Preview Telemetry
        deltaPitch = p;
        deltaRoll = r;

        const totalTilt = Math.sqrt(p ** 2 + r ** 2);
        pitchDisplay.textContent = `${p >= 0 ? '+' : ''}${p.toFixed(1)}°`;
        rollDisplay.textContent = `${r >= 0 ? '+' : ''}${r.toFixed(1)}°`;
        totalTiltDisplay.textContent = totalTilt.toFixed(1);

        const dotX = Math.max(-65, Math.min(65, r * 2));
        const dotY = Math.max(-65, Math.min(65, p * 2));
        tiltDot.style.transform = `translate(${dotX}px, ${dotY}px)`;
        rawDebug.textContent = `Live Fused: P: ${p.toFixed(1)}° | R: ${r.toFixed(1)}°`;
        return;
      }

      // Recording Mode: Calculate delta relative to baseline starting angle
      if (!baseline) {
        baseline = { pitch: p, roll: r };
        return;
      }

      let dP = p - baseline.pitch;
      let dR = r - baseline.roll;

      // Wraparound checks [-180, +180]
      if (dP > 180) dP -= 360;
      if (dP < -180) dP += 360;
      if (dR > 180) dR -= 360;
      if (dR < -180) dR += 360;

      deltaPitch = dP;
      deltaRoll = dR;

      const totalTilt = Math.sqrt(deltaPitch ** 2 + deltaRoll ** 2);
      const elapsedSec = ((Date.now() - recordStartTime) / 1000).toFixed(2);

      const entry = {
        time: elapsedSec,
        pitch: deltaPitch.toFixed(2),
        roll: deltaRoll.toFixed(2),
        total: totalTilt.toFixed(2)
      };

      recordedData.push(entry);

      // Render Telemetry
      pitchDisplay.textContent = `${deltaPitch >= 0 ? '+' : ''}${entry.pitch}°`;
      rollDisplay.textContent = `${deltaRoll >= 0 ? '+' : ''}${entry.roll}°`;
      totalTiltDisplay.textContent = entry.total;

      const dotX = Math.max(-65, Math.min(65, deltaRoll * 2));
      const dotY = Math.max(-65, Math.min(65, deltaPitch * 2));
      tiltDot.style.transform = `translate(${dotX}px, ${dotY}px)`;

      sampleCount.textContent = recordedData.length;
      rawDebug.textContent = `REC Fused P: ${p.toFixed(1)}° | R: ${r.toFixed(1)}°`;

      const logRow = document.createElement('div');
      logRow.className = "flex justify-between border-b border-slate-900 py-0.5";
      logRow.innerHTML = `
        <span class="text-slate-500">${entry.time}s</span>
        <span>P: <strong class="text-cyan-400">${entry.pitch}°</strong></span>
        <span>R: <strong class="text-indigo-400">${entry.roll}°</strong></span>
        <span>Tilt: <strong class="text-emerald-400">${entry.total}°</strong></span>
      `;
      logContainer.appendChild(logRow);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // -------------------------------------------------------------
    // 3. RECORDING & VIDEO STITCHING
    // -------------------------------------------------------------
    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    function startRecording() {
      recordedData = [];
      recordedVideoChunks = [];
      baseline = null; // Baseline locks on first recording frame
      recordStartTime = Date.now();
      isRecording = true;

      // Capture stream from 1080x1080 rotated canvas at 30 FPS
      const canvasStream = canvas.captureStream(30);

      const mimeTypes = [
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm',
        'video/mp4'
      ];
      
      let chosenType = mimeTypes.find(t => MediaRecorder.isTypeSupported(t)) || '';

      const recorderOptions = {
        mimeType: chosenType,
        videoBitsPerSecond: 8000000 // High bitrate 8 Mbps stream
      };

      try {
        mediaRecorder = new MediaRecorder(canvasStream, recorderOptions);
      } catch (e) {
        mediaRecorder = new MediaRecorder(canvasStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedVideoChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        recordedVideoBlob = new Blob(recordedVideoChunks, { type: chosenType || 'video/webm' });
        downloadVideoBtn.disabled = false;
      };

      mediaRecorder.start(100);

      // UI State
      recordBtnText.textContent = 'Stop Recording';
      recordBtn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600', 'shadow-emerald-500/20');
      recordBtn.classList.add('bg-rose-500', 'hover:bg-rose-600', 'shadow-rose-500/20');
      recordIcon.innerHTML = `<rect x="6" y="6" width="12" height="12" rx="2"/>`;

      statusDot.className = "w-3 h-3 rounded-full bg-rose-500 animate-ping";
      rotationStatus.textContent = "REC STABILIZING";
      downloadVideoBtn.disabled = true;
      exportCsvBtn.disabled = true;
      logContainer.innerHTML = '';
    }

    function stopRecording() {
      isRecording = false;

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }

      recordBtnText.textContent = 'Start Record';
      recordBtn.classList.remove('bg-rose-500', 'hover:bg-rose-600', 'shadow-rose-500/20');
      recordBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600', 'shadow-emerald-500/20');
      recordIcon.innerHTML = `<circle cx="12" cy="12" r="8"/>`;

      statusDot.className = "w-3 h-3 rounded-full bg-slate-600";
      rotationStatus.textContent = "FUSED ROTATION";

      if (recordedData.length > 0) {
        exportCsvBtn.disabled = false;
      }
    }

    // -------------------------------------------------------------
    // 4. DOWNLOAD EXPORTS
    // -------------------------------------------------------------
    downloadVideoBtn.addEventListener('click', () => {
      if (!recordedVideoBlob) return;
      const url = URL.createObjectURL(recordedVideoBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fusion_stabilized_video_${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    exportCsvBtn.addEventListener('click', () => {
      if (recordedData.length === 0) return;
      let csv = "Time_Seconds,Pitch_Delta_Deg,Roll_Delta_Deg,Total_Tilt_Deg\n";
      recordedData.forEach(d => {
        csv += `${d.time},${d.pitch},${d.roll},${d.total}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fusion_gyro_telemetry_${Date.now()}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
